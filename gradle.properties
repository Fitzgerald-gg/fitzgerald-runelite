# Plugin version (used in the built jar's file name).
version=1.0.0

# RuneLite client version to build against. 'latest.release' tracks the newest
# published client, which is what the Plugin Hub's own CI resolves. To insulate
# a local build from a breaking API bump, pin this to a concrete version, e.g.
#   runeLiteVersion=1.11.0
runeLiteVersion=latest.release
