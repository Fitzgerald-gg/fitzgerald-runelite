// Build script, modelled on runelite/example-plugin (BSD 2-Clause).
plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

// runeLiteVersion comes from gradle.properties. Pin it there if a new client
// API breaks the build.
def pluginMainClass = 'chronicle.ChronicleDevLauncher'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation 'org.mockito:mockito-core:4.11.0'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'chronicle'

// The descriptor has to be inside the jar or a sideloaded build is discovered
// but exposes no plugin.
jar {
	from('.') {
		include 'runelite-plugin.properties'
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

// `gradle run` launches a dev-mode RuneLite with this plugin side-loaded.
tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	// macOS + JDK 17: RuneLite's OSXFullScreenAdapter needs com.apple.eawt,
	// which the module system no longer exports by default.
	jvmArgs "-ea", "--add-exports", "java.desktop/com.apple.eawt=ALL-UNNAMED"
	args "--developer-mode", "--debug"
}

// `gradle shadowJar` produces the fat jar you side-load for manual testing.
tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}

// JournalReconcileTool reads -Dchronicle.* switches and prints what it merged.
// Gradle forwards neither to a test JVM on its own.
tasks.named('test') {
	System.properties.each { k, v ->
		if (k.toString().startsWith('chronicle.')) {
			systemProperty k.toString(), v
		}
	}
	testLogging {
		showStandardStreams = true
	}
}
