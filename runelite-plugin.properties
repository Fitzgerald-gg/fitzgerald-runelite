displayName=Fitzgerald.gg
author=cjrfitzgerald
description=Syncs your OSRS activity — loot, levels, kill counts, collection log, clues, quests, diaries, combat achievements, slayer, pets, deaths, group-storage movements and lifetime counters — to your profile on fitzgerald.gg, a third-party server operated by the plugin author. Off until you enable it; screenshot upload is a separate opt-in. Your profile is unlisted — reachable by its link but kept out of the public directory; you control lock/list/export/delete from the plugin's side panel.
tags=stats,tracker,loot,slayer,collection,external,osrs
version=
plugins=gg.fitzgerald.plugin.FitzgeraldPlugin
build=standard
